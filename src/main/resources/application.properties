spring.application.name=weather-app

# ---------------------------------------------
# Chiavi API
# ---------------------------------------------
# Impostale come variabili d'ambiente (OPENWEATHERMAP_API_KEY, PEXELS_API_KEY)
# oppure in src/main/resources/application-secret.properties (ignorato da git).
spring.config.import=optional:classpath:application-secret.properties

# OpenWeatherMap: gratuita su https://openweathermap.org/api
openweathermap.api.key=${OPENWEATHERMAP_API_KEY:}
# Pexels (facoltativa, per le foto di sfondo): gratuita su https://www.pexels.com/api/
pexels.api.key=${PEXELS_API_KEY:}

# ---------------------------------------------
# Database H2 su file: utenti e preferiti sopravvivono ai riavvii
# ---------------------------------------------
spring.datasource.url=${DATABASE_URL:jdbc:h2:file:./data/weatherdb}
spring.datasource.username=${DATABASE_USERNAME:sa}
spring.datasource.password=${DATABASE_PASSWORD:}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# La console H2 è attiva solo con il profilo "dev" (vedi application-dev.properties)
spring.h2.console.enabled=false

# ---------------------------------------------
# JWT
# ---------------------------------------------
# Almeno 32 caratteri. Senza JWT_SECRET viene generata una chiave casuale a ogni avvio.
jwt.secret=${JWT_SECRET:}
jwt.expiration=PT24H

# ---------------------------------------------
# HTTP client verso le API esterne
# ---------------------------------------------
spring.http.client.connect-timeout=5s
spring.http.client.read-timeout=10s

# ---------------------------------------------
# Server
# ---------------------------------------------
server.compression.enabled=true
server.compression.mime-types=application/json,text/html,text/css,application/javascript,image/svg+xml
server.compression.min-response-size=1024
server.error.include-stacktrace=never
server.error.include-message=never
